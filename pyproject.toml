[project]
name = "personal-workbench-workspace"
version = "0.1.0"
description = "使用 uv workspace 管理的插件化个人工作台"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
# packages 仅承载通用基础设施，导图引擎和 Qt 组件归属导图插件目录。
# 导图分组目录不放 pyproject.toml，避免 uv 从子包向上查找时误判工作区边界。
# 适配包和业务组件并列注册，保持十四个独立分发包及原有依赖方向。
members = [
    "packages/*",
    "plugins/workbench-plugin-text",
    "plugins/workbench-plugin-mindmap/adapter",
    "plugins/workbench-plugin-mindmap/engine/*",
    "plugins/workbench-plugin-mindmap/qt/*",
    "apps/*",
]

[tool.uv.sources]
mindmap-core = { workspace = true }
mindmap-layouts = { workspace = true }
mindmap-formats = { workspace = true }
mindmap-qt-render = { workspace = true }
mindmap-qt-ui = { workspace = true }
mindmap-qt-canvas = { workspace = true }
mindmap-qt-panels = { workspace = true }
workbench-docking = { workspace = true }
workbench-shell = { workspace = true }
workbench-api = { workspace = true }
workbench-runtime = { workspace = true }
workbench-plugin-mindmap = { workspace = true }
workbench-plugin-text = { workspace = true }
personal-workbench = { workspace = true }

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["packages", "plugins", "apps", "tests/integration"]
addopts = "--import-mode=importlib"
qt_api = "pyside6"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
