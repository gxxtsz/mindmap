[project]
name = "mindmap"
version = "0.1.0"
description = "使用 uv workspace 管理的原生思维导图项目"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
# 引擎、画布、停靠组件和桌面外壳统一在本仓库构建，共用一个锁文件。
members = ["packages/engine/*", "packages/mindmap-qt", "packages/mindmap-docking", "packages/mindmap-shell", "apps/*"]

[tool.uv.sources]
mindmap-core = { workspace = true }
mindmap-layouts = { workspace = true }
mindmap-formats = { workspace = true }
mindmap-engine = { workspace = true }
mindmap-qt = { workspace = true }
mindmap-docking = { workspace = true }
mindmap-shell = { workspace = true }

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["packages/engine/mindmap-core/tests", "packages/engine/mindmap-layouts/tests", "packages/engine/mindmap-formats/tests", "packages/engine/mindmap-engine/tests", "packages/mindmap-qt/tests", "tests/desktop", "apps/mindmap-workbench/tests"]
addopts = "--import-mode=importlib"
qt_api = "pyside6"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
