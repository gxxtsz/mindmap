[project]
name = "personal-workbench-workspace"
version = "0.1.0"
description = "使用 uv workspace 管理的插件化个人工作台"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
# packages 仅承载通用基础设施，导图引擎和 Qt 组件归属导图插件目录。
# 导图分组目录不放 pyproject.toml。四个分发成员共用根工作区和锁文件。
members = [
    "packages/*",
    "plugins/workbench-plugin-mindmap/core",
    "plugins/workbench-plugin-mindmap/qt-render",
    "plugins/workbench-plugin-mindmap/qt-editor",
    "plugins/workbench-plugin-mindmap/workbench-adapter",
    "apps/*",
]

[tool.uv.sources]
mindmap-core = { workspace = true }
mindmap-qt-render = { workspace = true }
mindmap-qt-editor = { workspace = true }
workbench-api = { workspace = true }
workbench-runtime = { workspace = true }
workbench-plugin-mindmap = { workspace = true }
personal-workbench = { workspace = true }

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["packages", "plugins", "apps"]
addopts = "--import-mode=importlib"
qt_api = "pyside6"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
