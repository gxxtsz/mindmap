[project]
name = "mindmap"
version = "0.1.0"
description = "使用 uv workspace 管理的原生思维导图项目"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
# 引擎、Qt 与桌面成员按子系统分组，全部成员共用工作区及锁文件。
members = ["packages/engine/*", "packages/qt/*", "packages/desktop/*", "apps/*"]

[tool.uv.sources]
mindmap-core = { workspace = true }
mindmap-layouts = { workspace = true }
mindmap-formats = { workspace = true }
mindmap-qt-render = { workspace = true }
mindmap-qt-ui = { workspace = true }
mindmap-qt-canvas = { workspace = true }
mindmap-qt-panels = { workspace = true }
mindmap-docking = { workspace = true }
mindmap-shell = { workspace = true }

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["packages", "apps", "tests/integration"]
addopts = "--import-mode=importlib"
qt_api = "pyside6"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
