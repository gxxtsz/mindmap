[project]
name = "mindmap"
version = "0.1.0"
description = "支持思维导图和节点图的桌面应用"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
# 图由所属导图保存，各成员共用根工作区及锁文件。
# packages 保留桌面基础设施；所有成员共用根工作区与锁文件。
members = [
    "packages/*",
    "mindmap/core",
    "mindmap/qt-render",
    "mindmap/qt-editor",
    "mindmap/application",
    "apps/*",
]

[tool.uv.sources]
mindmap-core = { workspace = true }
mindmap-qt-render = { workspace = true }
mindmap-qt-editor = { workspace = true }
mindmap-desktop-api = { workspace = true }
mindmap-desktop-runtime = { workspace = true }
mindmap-application = { workspace = true }
mindmap-app = { workspace = true }

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["packages", "mindmap", "apps"]
addopts = "--import-mode=importlib"
qt_api = "pyside6"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
