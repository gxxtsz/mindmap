[project]
name = "mindmap-application"
version = "0.1.0"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
description = "思维导图应用层、节点页面装配、文档会话与自动保存"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mindmap-desktop-api>=0.1.0,<0.2",
    "mindmap-core>=0.1.0,<0.2",
    "mindmap-qt-render>=0.1.0,<0.2",
    "mindmap-qt-editor>=0.1.0,<0.2",
    "PySide6>=6.12,<6.13",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mindmap_application"]

# 应用层只发行自身源码、测试及说明，其他导图组件通过显式依赖安装。
# 限定源码发行范围，让从源码包重建 wheel 时也保持相同的成员边界。
[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/pyproject.toml"]
