[project]
name = "mindmap-workbench"
version = "0.1.0"
description = "基于项目内置桌面外壳的原生思维导图工作台"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mindmap-core>=0.1.0,<0.2",
    "mindmap-layouts>=0.1.0,<0.2",
    "mindmap-formats>=0.1.0,<0.2",
    "mindmap-qt-canvas>=0.1.0,<0.2",
    "mindmap-qt-panels>=0.1.0,<0.2",
    "mindmap-qt-ui>=0.1.0,<0.2",
    "mindmap-qt-render>=0.1.0,<0.2",
    "mindmap-shell>=0.1.0,<0.2",
    "mindmap-docking>=0.1.0,<0.2",
    "PySide6>=6.12,<7",
]
license = "MIT"
license-files = ["LICENSE"]

[project.gui-scripts]
mindmap-workbench = "mindmap_workbench:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mindmap_workbench"]
