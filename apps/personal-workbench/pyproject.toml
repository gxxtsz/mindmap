[project]
name = "personal-workbench"
version = "0.1.0"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
description = "个人工作台应用入口、内置插件装配与历史配置迁移"
requires-python = ">=3.12,<3.14"
dependencies = ['workbench-runtime>=0.1.0,<0.2', 'workbench-plugin-mindmap>=0.1.0,<0.2', 'workbench-plugin-text>=0.1.0,<0.2', 'PySide6>=6.12,<6.13']

[project.gui-scripts]
personal-workbench = "personal_workbench:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_workbench"]
