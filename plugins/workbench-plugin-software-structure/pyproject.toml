[project]
name = "workbench-plugin-software-structure"
version = "0.1.0"
description = "工作台的软件结构文档与模块依赖图"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = ["workbench-api>=0.1.0,<0.2", "PySide6>=6.12,<6.13"]

[project.entry-points."personal_workbench.plugins"]
software-structure = "workbench_plugin_software_structure:manifest"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build]
# 工作区忽略用户的 .software-structure 文件，随插件分发的模板需要显式纳入打包。
artifacts = ["/src/workbench_plugin_software_structure/resources/软件结构模板.software-structure"]

[tool.hatch.build.targets.wheel]
packages = ["src/workbench_plugin_software_structure"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/pyproject.toml"]
