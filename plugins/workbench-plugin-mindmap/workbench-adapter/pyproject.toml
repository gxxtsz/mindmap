[project]
name = "workbench-plugin-mindmap"
version = "0.1.0"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
description = "思维导图的工作台接入、编辑视图、业务面板与自动保存"
requires-python = ">=3.12,<3.14"
dependencies = [
    "workbench-api>=0.1.0,<0.2",
    "mindmap-core>=0.1.0,<0.2",
    "mindmap-qt-render>=0.1.0,<0.2",
    "mindmap-qt-editor>=0.1.0,<0.2",
    "PySide6>=6.12,<6.13",
]

[project.entry-points."personal_workbench.plugins"]
mindmap = "workbench_plugin_mindmap:manifest"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workbench_plugin_mindmap"]

# 适配包只发行自身源码、测试及说明，其他导图组件通过显式依赖安装。
# 限定源码发行范围，让从源码包重建 wheel 时也保持相同的成员边界。
[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/pyproject.toml"]
