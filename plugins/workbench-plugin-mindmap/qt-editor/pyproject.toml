[project]
name = "mindmap-qt-editor"
version = "0.1.0"
description = "可嵌入的 Qt 思维导图画布、文件控制器、业务面板与共享控件"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mindmap-core>=0.1.0,<0.2",
    "mindmap-qt-render>=0.1.0,<0.2",
    "PySide6>=6.9,<7",
]
license = "MIT"
license-files = ["LICENSE"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mindmap_qt_editor"]
