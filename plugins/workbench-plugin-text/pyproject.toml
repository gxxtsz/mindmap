[project]
name = "workbench-plugin-text"
version = "0.1.0"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
description = "工作台纯文本编辑插件，支持共享视图与 UTF-8 原子保存"
requires-python = ">=3.12,<3.14"
dependencies = ['workbench-api>=0.1.0,<0.2', 'PySide6>=6.12,<6.13']

[project.entry-points."personal_workbench.plugins"]
text = "workbench_plugin_text:manifest"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workbench_plugin_text"]
