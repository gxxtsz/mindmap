[project]
name = "mindmap-qt-workspace"
version = "0.1.0"
description = "组合画布与业务面板的独立 Qt 停靠工作区"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mindmap-engine>=0.1.0,<0.2",
    "mindmap-qt-canvas>=0.1.0,<0.2",
    "mindmap-qt-panels>=0.1.0,<0.2",
    "mindmap-qt-ui>=0.1.0,<0.2",
    "PySide6>=6.9,<7",
]
license = "MIT"
license-files = ["LICENSE"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mindmap_qt_workspace"]
