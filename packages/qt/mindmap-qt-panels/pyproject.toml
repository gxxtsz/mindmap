[project]
name = "mindmap-qt-panels"
version = "0.1.0"
description = "通过公开宿主协议连接的大纲、属性与设置面板"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mindmap-core>=0.1.0,<0.2",
    "mindmap-qt-ui>=0.1.0,<0.2",
    "PySide6>=6.9,<7",
]
license = "MIT"
license-files = ["LICENSE"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mindmap_qt_panels"]
