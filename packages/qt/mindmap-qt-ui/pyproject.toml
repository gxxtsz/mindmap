[project]
name = "mindmap-qt-ui"
version = "0.1.0"
description = "思维导图的共享 Qt 控件、属性表单与弹窗"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mindmap-core>=0.1.0,<0.2",
    "mindmap-layouts>=0.1.0,<0.2",
    "mindmap-qt-render>=0.1.0,<0.2",
    "PySide6>=6.9,<7",
]
license = "MIT"
license-files = ["LICENSE"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mindmap_qt_ui"]
