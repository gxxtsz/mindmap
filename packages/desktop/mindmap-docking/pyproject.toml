[project]
name = "mindmap-docking"
version = "0.1.0"
description = "思维导图项目的原生停靠、标签与分屏组件"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "PySide6>=6.12,<6.13",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mindmap_docking"]
