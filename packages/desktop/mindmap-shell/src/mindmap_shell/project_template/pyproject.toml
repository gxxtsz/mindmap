[project]
name = "my-desktop-app"
version = "0.1.0"
description = "基于 mindmap-shell 的独立桌面应用"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["mindmap-shell>=0.1.0,<0.2.0", "mindmap-docking>=0.1.0,<0.2.0", "PySide6>=6.12,<6.13"]

[project.scripts]
my-desktop-app = "my_desktop_app.app:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_desktop_app"]

[tool.uv]
constraint-dependencies = ["PySide6==6.12.0"]
