[project]
name = "mindmap-engine"
version = "0.1.0"
description = "思维导图核心、内置布局和文档格式的默认组合入口"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["mindmap-core>=0.1.0,<0.2", "mindmap-layouts>=0.1.0,<0.2", "mindmap-formats>=0.1.0,<0.2"]
license = "MIT"
license-files = ["LICENSE"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mindmap_engine"]
