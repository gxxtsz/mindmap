[project]
name = "mindmap-desktop-api"
version = "0.1.0"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
description = "导图应用与桌面基础设施的内部协议和界面声明"
requires-python = ">=3.12,<3.14"
dependencies = ["PySide6>=6.12,<6.13"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mindmap_desktop_api"]
