[project]
name = "workbench-docking"
version = "0.1.0"
description = "通用 Qt 停靠、文档标签、分屏与布局持久化组件"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "PySide6>=6.12,<6.13",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workbench_docking"]
