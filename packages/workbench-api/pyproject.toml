[project]
name = "workbench-api"
version = "0.1.0"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
description = "个人工作台的插件协议和界面扩展声明"
requires-python = ">=3.12,<3.14"
dependencies = ["PySide6>=6.12,<6.13"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workbench_api"]
