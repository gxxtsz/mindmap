[project]
name = "workbench-shell"
version = "0.1.0"
description = "通用 Qt 桌面外壳、应用动作与启动流程"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "workbench-docking>=0.1.0,<0.2",
    "PySide6>=6.12,<6.13",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workbench_shell"]
